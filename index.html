<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#7F37FF" />
<meta name="description" content="Contactplanner voor huisbezoek, alle gegevens blijven lokaal in je eigen browser." />
<title>ContactPlanner</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="styles.css" />
<script>
  // Dag/nacht-keuze direct toepassen, vóór de eerste weergave (zie pasKleurModusToe in app.js).
  try {
    var w = localStorage.getItem("contactplanner-kleurmodus");
    if (w === "licht") document.documentElement.setAttribute("data-theme", "light");
    if (w === "donker") document.documentElement.setAttribute("data-theme", "dark");
  } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<script src="vendor/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
